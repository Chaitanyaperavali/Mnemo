site_name: Mnemo
site_description: LLM agent memory orchestration library
site_url: https://yourorg.github.io/mnemo
repo_url: https://github.com/yourorg/mnemo
repo_name: yourorg/mnemo
edit_uri: edit/main/docs/

copyright: "Copyright &copy; 2025 Your Name"

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

  icon:
    repo: fontawesome/brands/github

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            # Source layout
            paths: [src]
            # Rendering
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            merge_init_into_class: true
            show_submodules: false
            # Signatures
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            # Members
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_bases: true
            filters:
              - "!^_"   # hide private members by default

# ---------------------------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------------------------
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# ---------------------------------------------------------------------------
# Navigation
# ---------------------------------------------------------------------------
nav:
  - Home: index.md
  - Getting Started:
    - Installation: guides/installation.md
    - Quick Start: guides/quickstart.md
    - Backends: guides/backends.md
    - Async & Sync: guides/async.md
  - API Reference:
    - mnemo: api/index.md
    - Store: api/store.md
    - Protocols: api/protocols.md
    - Types: api/types.md
    - Backends:
      - In-Memory: api/backends/memory.md
  - Contributing: contributing.md
  - Changelog: changelog.md
