name: Publish to PyPI

# Triggered when you create a GitHub Release (tag vX.Y.Z)
on:
  release:
    types: [published]

jobs:
  # -------------------------------------------------------------------------
  # 1. Build — restricted permissions, no PyPI credentials in this job
  # -------------------------------------------------------------------------
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    # Minimal permissions — build does NOT need id-token
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel and sdist
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # -------------------------------------------------------------------------
  # 2. Publish — uses OIDC Trusted Publishing (no long-lived API tokens)
  #
  #    One-time PyPI setup:
  #      PyPI > Your project > Publishing > Add a new publisher
  #      Provider: GitHub Actions
  #      Owner:    yourorg
  #      Repo:     mnemo
  #      Workflow: publish.yml
  #      Env:      pypi          ← must match `environment:` below
  # -------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mnemo
    permissions:
      id-token: write   # REQUIRED for OIDC Trusted Publishing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No username/password/token needed — OIDC handles auth

  # -------------------------------------------------------------------------
  # 3. GitHub Release notes — attach the built artifacts to the release
  # -------------------------------------------------------------------------
  attach-assets:
    name: Attach dist to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
