[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata — PEP 621
# ---------------------------------------------------------------------------
[project]
name = "mnemo"
version = "0.1.0"
description = "LLM agent memory orchestration library"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Your Name", email = "you@example.com" }]
maintainers = [{ name = "Your Name", email = "you@example.com" }]
keywords = [
  "llm",
  "agent",
  "memory",
  "orchestration",
  "ai",
  "rag",
  "vector-store",
  "embeddings",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

# Runtime dependencies — keep this minimal for a library
dependencies = [
  "anyio>=4.0",
  "typing-extensions>=4.5; python_version<'3.12'",
]

[project.urls]
Homepage     = "https://github.com/yourorg/mnemo"
Documentation = "https://yourorg.github.io/mnemo"
Repository   = "https://github.com/yourorg/mnemo"
"Bug Tracker" = "https://github.com/yourorg/mnemo/issues"
Changelog    = "https://github.com/yourorg/mnemo/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Optional / extra dependencies
# ---------------------------------------------------------------------------
[project.optional-dependencies]
# Specific backend integrations — users install only what they need
redis    = ["redis>=5.0"]
pgvector = ["asyncpg>=0.29", "pgvector>=0.2"]
openai   = ["openai>=1.0"]

# Docs extras (used in CI and locally)
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "mkdocs-gen-files>=0.5",
  "mkdocs-literate-nav>=0.6",
  "mkdocs-section-index>=0.3",
]

# ---------------------------------------------------------------------------
# Hatchling build configuration
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/mnemo"]

# ---------------------------------------------------------------------------
# uv — dependency groups (PEP 735, replaces [project.optional-dependencies]
# for dev-only deps)
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
  "mnemo[docs,redis,openai]",   # install all extras during dev
  # Testing
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.5",
  "pytest-randomly>=3.15",
  "pytest-timeout>=2.3",
  "pytest-mock>=3.14",
  # Type checking
  "mypy>=1.10",
  "pyright>=1.1.370",
  # Linting / formatting
  "ruff>=0.9",
  # Pre-commit
  "pre-commit>=3.7",
]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 88
indent-width   = 4
target-version = "py310"

# Directories ruff should never touch
exclude = [
  ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg",
  ".mypy_cache", ".nox", ".pants.d", ".pyenv", ".pytest_cache",
  ".pytype", ".ruff_cache", ".svn", ".tox", ".venv", "__pypackages__",
  "_build", "buck-out", "build", "dist", "site-packages", "venv",
  "docs",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # Pyflakes
  "UP",   # pyupgrade — modernise syntax automatically
  "B",    # flake8-bugbear — opinionated correctness
  "C4",   # flake8-comprehensions — simplify comprehensions
  "I",    # isort — import ordering
  "N",    # pep8-naming
  "D",    # pydocstyle — enforce docstrings
  "S",    # flake8-bandit — security
  "T20",  # flake8-print — no stray print() calls in library code
  "PT",   # flake8-pytest-style
  "RUF",  # Ruff-native rules
  "ANN",  # flake8-annotations — require type annotations
  "PERF", # perflint — performance anti-patterns
  "SIM",  # flake8-simplify
  "TCH",  # flake8-type-checking — TYPE_CHECKING guards
  "TID",  # flake8-tidy-imports
  "FA",   # flake8-future-annotations
]
ignore = [
  "D100",   # Missing docstring in public module (too noisy in __init__.py)
  "D104",   # Missing docstring in public package
  "D107",   # Missing docstring in __init__
  "ANN101", # self doesn't need type annotation
  "ANN102", # cls doesn't need type annotation
  "S101",   # assert is fine in tests (see per-file-ignores)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py"       = ["S101", "ANN", "D"]
"src/mnemo/__init__.py" = ["F401"]   # re-exported names
"docs/**/*.py"        = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"   # google | numpy | pep257

[tool.ruff.lint.isort]
known-first-party = ["mnemo"]
split-on-trailing-comma = true

[tool.ruff.lint.flake8-type-checking]
# Move pure-typing imports behind TYPE_CHECKING automatically
strict = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"   # disallow `from ..foo import bar`

[tool.ruff.format]
quote-style               = "double"
indent-style              = "space"
skip-magic-trailing-comma = false
docstring-code-format     = true
docstring-code-line-length = 72

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version            = "3.10"
strict                    = true
warn_return_any           = true
warn_unused_configs       = true
warn_redundant_casts      = true
warn_unused_ignores       = true
disallow_untyped_defs     = true
disallow_incomplete_defs  = true
disallow_untyped_decorators = true
check_untyped_defs        = true
disallow_any_generics     = true
no_implicit_reexport      = true
# Show column numbers and error codes for easier grep/navigation
show_column_numbers       = true
show_error_codes          = true
pretty                    = true

# Per-module overrides for third-party libs that lack stubs
[[tool.mypy.overrides]]
module = ["redis.*", "pgvector.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pyright (VS Code / IDE)  — also used in CI via `pyright` CLI
# ---------------------------------------------------------------------------
[tool.pyright]
include                 = ["src"]
exclude                 = ["**/__pycache__", ".venv", "dist", "build"]
pythonVersion           = "3.10"
typeCheckingMode        = "strict"
# These match the mypy strict equivalents
reportMissingImports            = true
reportMissingTypeStubs          = false   # don't fail on stub-less packages
reportUnknownMemberType         = true
reportUnknownArgumentType       = true
reportUnknownVariableType       = true
reportUntypedFunctionDecorator  = false   # common in tests

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion   = "8.0"
pythonpath   = ["src"]
testpaths    = ["tests"]
addopts      = [
  "-ra",
  "-q",
  "--strict-markers",           # fail on unknown markers
  "--import-mode=importlib",    # modern import mode
  "--cov=mnemo",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=80",
]
asyncio_mode = "auto"           # pytest-asyncio ≥ 0.21
asyncio_default_fixture_loop_scope = "function"
timeout      = 30               # seconds; avoids hanging tests

markers = [
  "slow: deselect with '-m \"not slow\"'",
  "integration: requires live external services",
  "unit: pure unit tests with no I/O",
  "backend(name): tests specific to a storage backend",
]

[tool.coverage.run]
branch  = true
source  = ["src/mnemo"]
omit    = ["*/__main__.py", "*/conftest.py"]

[tool.coverage.report]
show_missing        = true
skip_covered        = false
exclude_lines       = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
  "\\.\\.\\.",   # bare ellipsis (Protocol method bodies)
]
